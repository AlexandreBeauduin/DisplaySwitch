name: Release

# Push a tag matching the version in Resources/Info.plist, e.g.:
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        run: swift test
      - name: Build and package
        run: scripts/release.sh
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[?" v "\\]?" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "DisplaySwitch $version" > notes.md
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "build/DisplaySwitch-${GITHUB_REF_NAME#v}.zip" \
            "build/DisplaySwitch-${GITHUB_REF_NAME#v}.zip.sha256" \
            --title "DisplaySwitch ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md
